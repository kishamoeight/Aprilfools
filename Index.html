<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CGS Daily Conso Abs Report</title>

<style>
body {
    margin: 0;
    font-family: Calibri, Arial, sans-serif;
    background: #f5f5f5;
}

/* Fake Excel container */
.sheet {
    width: 1400px;
    margin: 20px auto;
    background: white;
    border: 1px solid #ccc;
    box-shadow: 0 0 10px rgba(0,0,0,0.1);
}

/* Header row */
.header {
    display: grid;
    grid-template-columns: 120px 120px 120px 1fr repeat(5, 120px) 150px;
    background: #0b2e6b;
    color: white;
    font-weight: bold;
}

.header div {
    padding: 10px;
    border: 1px solid #0a2558;
}

/* Rows */
.row {
    display: grid;
    grid-template-columns: 120px 120px 120px 1fr repeat(5, 120px) 150px;
}

.row div {
    padding: 8px;
    border: 1px solid #ddd;
    font-size: 14px;
}

/* Section styles */
.group-blue {
    background: #0b2e6b;
    color: white;
    font-weight: bold;
}

.group-light {
    background: #e6eef7;
}

.group-beige {
    background: #f3e1d6;
}

/* Popup */
.popup {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.92);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.popup video {
    width: 80%;
    max-width: 900px;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(0,0,0,0.9);
}
</style>
</head>

<body>

<div class="sheet">

    <div class="header">
        <div>Tower</div>
        <div>Site</div>
        <div>Work set up</div>
        <div>LOBs</div>
        <div>Sick Leave</div>
        <div>Personal</div>
        <div>Weather</div>
        <div>NCNS</div>
        <div>Others</div>
        <div>Total Absences %</div>
    </div>

    <!-- Carelon Services -->
    <div class="row group-blue">
        <div></div><div></div><div></div>
        <div>Carelon Services</div>
        <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>

    <div class="row group-beige">
        <div></div><div></div><div></div>
        <div>Carelon Medical Benefits Management</div>
        <div></div><div></div><div></div><div></div><div></div><div>--</div>
    </div>

    <div class="row group-beige">
        <div></div><div></div><div></div>
        <div>Aspire</div>
        <div></div><div></div><div></div><div></div><div></div><div>--</div>
    </div>

    <!-- RX -->
    <div class="row group-blue">
        <div></div><div></div><div></div>
        <div>Carelon RX</div>
        <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>

    <div class="row group-light">
        <div></div><div></div><div></div>
        <div>PA IB Comms</div>
        <div></div><div></div><div></div><div></div><div></div><div>--</div>
    </div>

    <div class="row group-light">
        <div></div><div></div><div></div>
        <div>PA IB Medicare</div>
        <div></div><div></div><div></div><div></div><div></div><div>--</div>
    </div>

    <!-- Commercial -->
    <div class="row group-blue">
        <div></div><div></div><div></div>
        <div>Commercial</div>
        <div></div><div></div><div></div><div></div><div></div><div></div>
    </div>

    <div class="row group-beige">
        <div></div><div></div><div></div>
        <div>Claims</div>
        <div></div><div></div><div></div><div></div><div></div><div>--</div>
    </div>

</div>

<!-- POPUP VIDEO -->
<div class="popup" id="popup">
    <video id="rickvid" loop playsinline>
        <source src="https://raw.githubusercontent.com/kishamoeight/Aprilfools/7490c9d2f5d487c14c8d3c8b36652d2cdb9a5df8/VID_20260331_210530.mp4" type="video/mp4">
    </video>
</div>

<script>
setTimeout(() => {
    const popup = document.getElementById('popup');
    const video = document.getElementById('rickvid');

    popup.style.display = 'flex';

    // Start muted (to bypass autoplay restrictions)
    video.muted = true;

    video.play().then(() => {
        // Unmute shortly after playing 😈
        setTimeout(() => {
            video.muted = false;
        }, 500);
    }).catch(() => {
        // If autoplay fails, force play on click
        document.body.addEventListener('click', () => {
            video.play();
        }, { once: true });
    });

}, 4000);
</script>

</body>
</html>
